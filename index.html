<!-- ================= MAIN IMAGE LOADER ================= -->
<script>
(function () {
    const qs = new URLSearchParams(location.search);
    const campaignId = qs.get("var_2");
    const mainCreative = qs.get("creative_id");
    if (!campaignId || !mainCreative) return;

    const CDN = "https://cdn.x0x.online/frames";
    const main = document.querySelector(".xh-frame");
    if (main) main.style.backgroundImage = `url(${CDN}/${campaignId}/${mainCreative}.webp)`;
})();
</script>

<!-- ================= VIDEO TITLE I18N ================= -->
<script>
(function () {
    const el = document.getElementById("video-title");
    if (!el) return;

    const I18N = {
        en: "Private video is trending online 🔥 Watch now",
        ru: "Приватное видео набирает просмотры 🔥 Смотри сейчас",
        es: "El video privado se vuelve viral 🔥 Míralo ahora",
        pt: "O vídeo privado está viralizando 🔥 Assista agora"
    };

    let lang = (navigator.language || "en").toLowerCase().split("-")[0];
    if (["uk","be","kk"].includes(lang)) lang = "ru";
    if (!I18N[lang]) lang = "en";

    el.textContent = I18N[lang];
})();
</script>

<!-- ================= FAKE PLAYBACK ================= -->
<script>
(function () {
    const player = document.querySelector('.main-player');
    const play = player?.querySelector('.play-button');
    const filled = player?.querySelector('.progress-filled');
    const knob = player?.querySelector('.progress-knob');
    if (!player || !play || !filled || !knob) return;

    setTimeout(() => {
        play.style.transition = 'opacity .35s ease';
        play.style.opacity = '0';

        filled.style.transition = 'width 1.1s linear';
        knob.style.transition = 'left 1.1s linear';
        filled.style.width = '48%';
        knob.style.left = '48%';

        player.classList.add('is-playing');
    }, 650);
})();
</script>
